<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Button Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Button Demo</h1>
        <button type="button" id="clickButton">Click me</button>
        <p id="clickCount" aria-live="polite">Clicked 0 times</p>
        <script>
            let count = 0;
            const button = document.getElementById("clickButton");
            const output = document.getElementById("clickCount");
            button.addEventListener("click", () => {
                count++;
                output.textContent = `Clicked ${count} time${count === 1 ? "" : "s"}`;
            });
        </script>
    </body>
</html>
